name: Validate NEAT NEET Planner

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/validate.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check UI
        run: bun run check:ui
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
