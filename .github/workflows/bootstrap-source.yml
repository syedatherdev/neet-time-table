name: Import NEAT NEET Planner source

on:
  push:
    branches: [main]
    paths:
      - .source-import-trigger

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download complete website source archive
        run: |
          curl --fail --location --retry 3 \
            "https://d2ol7oe51mr4n9.cloudfront.net/user_3Joqyj306dOTvdaYTxpkTmn4Iuj/30992570-0f34-4869-bcca-a9b0901da143.gz" \
            --output /tmp/neet-planner-source.tar.gz
          tar -tzf /tmp/neet-planner-source.tar.gz >/dev/null

      - name: Extract source files
        run: tar -xzf /tmp/neet-planner-source.tar.gz -C .

      - name: Commit the complete website source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .gitignore app
          git diff --cached --quiet || git commit -m "Import complete NEAT NEET Planner website"
          git push origin HEAD:main
